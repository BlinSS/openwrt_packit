name: Packit ImmortalWrt for RK3328 L1Pro

on:
  workflow_dispatch: # 支持手动触发打包

env:
  TZ: Asia/Shanghai
  ROOTFS_URL: "https://downloads.immortalwrt.org/releases/25.12.0/targets/armsr/armv8/immortalwrt-25.12.0-armsr-armv8-rootfs.tar.gz"
  # 预选一个比较稳定的 Flippy 内核版本（打包脚本内部默认包含或去对应仓库拉取）
  KERNEL_VERSION: "6.1.y" 

jobs:
  packit:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/libexec/docker/cli-plugins/docker-buildx
        sudo apt-get update
        sudo apt-get -y install pigz uuid-runtime gawk axel
        sudo timedatectl set-timezone "${TZ}"

    - name: Download ImmortalWrt Rootfs
      run: |
        # 将下载的 rootfs 命名为脚本默认识别的通用标准名称
        cat <<EOF
        Downloading Rootfs from: ${{ env.ROOTFS_URL }}
        EOF
        curl -Lo openwrt-armvirt-64-default-rootfs.tar.gz "${{ env.ROOTFS_URL }}"

    - name: Prepare Flippy Kernels
      run: |
        # 创建内核存放目录
        mkdir -p kernel
        
        # 提示：Flippy 脚本打包需要对应的内核 tar 包（包含 boot-*.tar.gz, modules-*.tar.gz, dtb-*.tar.gz）
        # 很多第三方维护的 openwrt_packit 会从公用仓库拉取内核。这里我们先通过环境变量或 make.env 指定内核版本
        if [ -f "make.env" ]; then
          sed -i 's/KERNEL_VERSION=.*/KERNEL_VERSION="${{ env.KERNEL_VERSION }}"/g' make.env || true
        fi

    - name: Run Packit Script for L1Pro
      run: |
        sudo chmod +x *.sh
        
        # 运行专门针对我家云/联想 L1 Pro 的打包脚本
        if [ -f "mk_rk3328_l1pro.sh" ]; then
          sudo ./mk_rk3328_l1pro.sh
        else
          echo "未找到 mk_rk3328_l1pro.sh，尝试通用 rk3328 脚本并指定 L1Pro"
          # 如果仓库改版了，可以使用通用脚本并注入变量
          sudo BOARD=l1pro ./mk_rk3328.sh || sudo ./mk_rk3328.sh
        fi

    - name: Prepare Artifacts
      run: |
        mkdir -p ./release_firmware
        # 搜寻打包出来的 output 或 out 目录下的 img 固件
        if [ -d "output" ]; then
          mv output/* ./release_firmware/ || true
        elif [ -d "out" ]; then
          mv out/* ./release_firmware/ || true
        fi

    - name: Upload Firmware to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: ImmortalWrt-25.12.0-L1Pro-${{ github.run_id }}
        name: MyCloud L1Pro ImmortalWrt 25.12.0
        body: |
          ### 固件信息
          * **源码版本**: ImmortalWrt 25.12.0 Stable
          * **打包设备**: 我家云 / 联想 L1 Pro (RK3328)
          * **内核分支**: ${{ env.KERNEL_VERSION }}
          * **默认IP**: 192.168.1.1 (或根据源码设定)
        files: |
          release_firmware/*.img
          release_firmware/*.gz
          release_firmware/*.xz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
