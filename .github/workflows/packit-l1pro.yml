name: Packit ImmortalWrt for RK3328 L1Pro (Kernel 6.12)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      set_kernel:
        description: "选择打包的内核版本"
        required: false
        default: "6.12.y"

env:
  # 使用您指定的 ImmortalWrt 25.12.0 官方 rootfs
  OPENWRT_ARMVIRT: "https://immortalwrt.org"
  # 【底层核心配置】告诉 main.sh 脚本我们要处理 rk3328 平台以及 l1pro 机型
  SOC: "rk3328"
  BOARD: "l1pro"
  WHOLE_PACK: "false"
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Initialization Environment
      id: init
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/libexec/docker/cli-plugins/docker-buildx
        sudo apt-get update
        sudo apt-get -y install pigz uuid-runtime gawk axel qemu-user-static
        sudo timedatectl set-timezone "${TZ}"
        
        echo "compile_status=success" >> $GITHUB_ENV
        echo "version=$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT

    - name: Download ImmortalWrt Rootfs
      run: |
        # 对应 ophub 框架体系，rootfs 应该规范存放在 openwrt-armvirt 目录下
        mkdir -p openwrt-armvirt
        echo "Downloading: ${{ env.OPENWRT_ARMVIRT }}"
        curl -Lo openwrt-armvirt/openwrt-armvirt-64-default-rootfs.tar.gz "${{ env.OPENWRT_ARMVIRT }}"

    - name: Package OpenWrt Image
      run: |
        sudo chmod +x *.sh
        
        # 提取填入的内核版本并重刷参数配置文件
        INPUT_KERNEL="${{ github.event.inputs.set_kernel }}"
        KERNEL_VERSION="${INPUT_KERNEL:-6.12.y}"
        
        if [ -f "make.env" ]; then
            sed -i "s/KERNEL_VERSION=.*/KERNEL_VERSION=\"${KERNEL_VERSION}\"/g" make.env || true
        fi
        sed -i "s/KERNEL_VERSION=\"6.1.y\"/KERNEL_VERSION=\"${KERNEL_VERSION}\"/g" *.sh *.env 2>/dev/null || true
        
        echo "当前打包使用的最终内核目标版本为: ${KERNEL_VERSION}"
        
        # 【核心修正】该仓库的通用统一调度主入口是公用的 main.sh，它会自行根据系统变量加载 rk3328
        sudo ./main.sh

    - name: Process Output Files
      run: |
        mkdir -p ./artifact
        # 统一搜寻产出固件并移动至临时发布目录
        if [ -d "output" ]; then
            mv output/* ./artifact/ || true
        elif [ -d "out" ]; then
            mv out/* ./artifact/ || true
        fi
        cd ./artifact && ls -l

    - name: Upload Firmware to Release
      uses: softprops/action-gh-release@v3
      if: env.compile_status == 'success' && !cancelled()
      with:
        tag_name: ImmortalWrt-25.12.0-l1pro-k6.12-${{ steps.init.outputs.version }}
        name: MyCloud L1Pro ImmortalWrt 25.12.0 (Kernel 6.12)
        body: |
          ### 固件基本配置
          * **系统源码**: ImmortalWrt 25.12.0 Stable 
          * **固件内核**: Linux Kernel ${{ github.event.inputs.set_kernel || '6.12.y' }} LTS
          * **适配硬件**: 我家云 / 联想 L1 Pro (RK3328)
          * **打包脚本**: BlinSS/openwrt_packit (main.sh)
        files: |
          artifact/*.img
          artifact/*.gz
          artifact/*.xz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
