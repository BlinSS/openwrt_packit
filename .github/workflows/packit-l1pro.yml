name: Packit ImmortalWrt for RK3328 L1Pro

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      set_kernel:
        description: "选择打包的内核版本 (默认 6.1.y)"
        required: false
        default: "6.1.y"

env:
  # 使用您指定的 ImmortalWrt 25.12.0 官方 rootfs
  OPENWRT_ARMVIRT: "https://immortalwrt.org"
  # 锁定设备参数
  SOC: "rk3328"
  BOARD: "l1pro"
  WHOLE_PACK: "false"
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
    # 升级至 v6，原生支持 Node 24 运行环境
    - name: Checkout
      uses: actions/checkout@v6

    - name: Initialization Environment
      id: init
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/libexec/docker/cli-plugins/docker-buildx
        sudo apt-get update
        sudo apt-get -y install pigz uuid-runtime gawk axel qemu-user-static
        sudo timedatectl set-timezone "${TZ}"
        
        echo "compile_status=success" >> $GITHUB_ENV
        echo "version=$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT

    - name: Download ImmortalWrt Rootfs
      run: |
        mkdir -p openwrt-armvirt
        echo "Downloading: ${{ env.OPENWRT_ARMVIRT }}"
        curl -Lo openwrt-armvirt/openwrt-armvirt-64-default-rootfs.tar.gz "${{ env.OPENWRT_ARMVIRT }}"

    - name: Package OpenWrt Image
      run: |
        sudo chmod +x *.sh
        
        INPUT_KERNEL="${{ github.event.inputs.set_kernel }}"
        KERNEL_VERSION="${INPUT_KERNEL:-6.1.y}"
        if [ -f "make.env" ]; then
            sed -i "s/KERNEL_VERSION=.*/KERNEL_VERSION=\"${KERNEL_VERSION}\"/g" make.env || true
        fi
        
        sudo ./mk_rk3328.sh

    - name: Process Output Files
      run: |
        mkdir -p ./artifact
        if [ -d "output" ]; then
            mv output/* ./artifact/ || true
        elif [ -d "out" ]; then
            mv out/* ./artifact/ || true
        fi
        cd ./artifact && ls -l

    # 升级至 v3，完美原生适配新版 GitHub 运行器
    - name: Upload Firmware to Release
      uses: softprops/action-gh-release@v3
      if: env.compile_status == 'success' && !cancelled()
      with:
        tag_name: ImmortalWrt-25.12.0-l1pro-${{ steps.init.outputs.version }}
        name: MyCloud L1Pro ImmortalWrt 25.12.0
        body: |
          ### 固件信息
          * **官方源码**: ImmortalWrt 25.12.0 Stable
          * **硬件架构**: armsr-armv8 (通用 ARM64)
          * **适配机型**: 我家云 / 联想 L1 Pro (RK3328)
          * **打包基准**: 基于 BlinSS/openwrt_packit 自动流
        files: |
          artifact/*.img
          artifact/*.gz
          artifact/*.xz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
